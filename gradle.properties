# JVM args. -Xmx is conservative — bump if memory pressure shows up in CI.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for Compose, Hilt, lifecycle-2.x).
android.useAndroidX=true

# Kotlin: official code style.
kotlin.code.style=official

# Non-transitive R class — faster builds, encourages explicit resource imports.
android.nonTransitiveRClass=true
